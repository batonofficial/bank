<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>monobank Push</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: #fff;
    }
    button {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="pushBtn">Запустити таймер 1(5 сек)</button>

  <script>
    // Регистрация Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    document.getElementById('pushBtn').addEventListener('click', async () => {
      // 1. Явный запрос разрешения при клике
      const permission = await Notification.requestPermission();
      
      if (permission !== 'granted') {
        alert('Потрібно дозволити сповіщення в налаштуваннях браузера!');
        return;
      }

      alert('Таймер запущено! Згорніть браузер або заблокуйте екран.');

      // 2. Отправка через Service Worker
      setTimeout(async () => {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification('monobank', {
          body: 'Поповнення картки *8421 на 15 000 ₴ від Іван І.\nБаланс: 18 420.50 ₴',
          icon: 'https://pwa.monobank.ua/icons/icon-512x512.png',
          badge: 'https://pwa.monobank.ua/icons/icon-512x512.png',
          vibrate: [200, 100, 200]
        });
      }, 5000);
    });
  </script>
</body>
</html>
