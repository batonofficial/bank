<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>monobank Push Trigger</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #111;
      color: #fff;
    }
    button {
      background-color: #e50914;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <button onclick="sendMonoPush()">Запустити таймер (5 сек)</button>

  <script>
    function sendMonoPush() {
      // Запрос разрешения на уведомления
      if (!("Notification" in window)) {
        alert("Ваш браузер не поддерживает Push-уведомления");
        return;
      }

      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          // Задержка 5 секунд (время, чтобы свернуть браузер или заблокировать экран)
          setTimeout(() => {
            new Notification('monobank', {
              body: 'Поповнення картки *8421 на 15 000 ₴ від Іван І.\nБаланс: 18 420.50 ₴',
              icon: 'https://pwa.monobank.ua/icons/icon-512x512.png', // Официальная иконка monobank
              badge: 'https://pwa.monobank.ua/icons/icon-512x512.png',
              tag: 'mono-transfer'
            });
          }, 5000);
        } else {
          alert("Для работы требуется разрешить уведомления в настройках браузера!");
        }
      });
    }
  </script>
</body>
</html>
